plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elitestream.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.elitestream.app'
        // Android 5.0+: Android TV boxes and phones. Secrets need Android 6.0+ (Keystore AES).
        minSdk 21
        targetSdk 34
        // versionCode = MAJOR*10000 + MINOR*100 + PATCH (CP2 identity proposal §6). History: 1 = 0.2.0, 2 = 0.3.0, 301 = 0.3.1-beta.1, 302 = 0.3.2-beta.1, 303 = 0.3.3-beta.1.
        versionCode 304
        versionName '0.3.4-beta.1'
    }

    // Release signing: the EliteStream production key lives OUTSIDE the repository. Its path and
    // passwords come from ~/.gradle/gradle.properties (ELITESTREAM_KEYSTORE, ELITESTREAM_KEYSTORE_PASSWORD,
    // ELITESTREAM_KEY_ALIAS, ELITESTREAM_KEY_PASSWORD). Without them a release build stays unsigned and
    // scripts/android.mjs refuses to publish it. Debug builds keep the Android debug key.
    def releaseKeystore = project.findProperty('ELITESTREAM_KEYSTORE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword project.findProperty('ELITESTREAM_KEYSTORE_PASSWORD')
                keyAlias project.findProperty('ELITESTREAM_KEY_ALIAS')
                keyPassword project.findProperty('ELITESTREAM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
